    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem("chesslens:settings") || "{}").theme;
        var st = JSON.parse(localStorage.getItem("chesslens:settings") || "{}");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (st.boardTheme && st.boardTheme !== "classic") document.documentElement.dataset.board = st.boardTheme;
      } catch (e) {}
    </script>
